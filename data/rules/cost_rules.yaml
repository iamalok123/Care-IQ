# CareIQ Cost & Proportionate Deduction Rules
# Section 18 & Appendix A

version: "1.0.0"

proportionate_deductions:
  enabled: true
  description: "When a room category exceeding policy entitlement is chosen, non-room associated medical charges (doctor visits, surgery fees, OT charges) are scaled proportionately."
  formula: "payable_associated_cost = actual_cost * (eligible_room_tariff / selected_room_tariff)"
  exceptions:
    - "Medicine and pharmacy consumables (billed at actuals)"
    - "Fixed implant costs with statutory price capping"

non_payable_consumables:
  categories:
    - "Gloves, PPE, and surgical masks"
    - "Admission and registration administration charges"
    - "Dietary supplements and extra attendant meals"
    - "Housekeeping and sanitization kits"
  typical_percentage_range:
    min: 4.0
    max: 8.0
    default_estimate_percent: 5.5

government_schemes:
  pmjay:
    cashless_rate: 100
    zero_out_of_pocket: true
    package_pricing_mandatory: true
