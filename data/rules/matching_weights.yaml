# CareIQ Matching Engine Weights Configuration
# Section 17 & Appendix A

version: "1.0.0"
weights:
  network_status: 35        # In-network cashless compatibility
  room_compatibility: 25    # Compliance with policy room category
  specialties_services: 15  # Availability of required clinical department
  critical_care_icu: 10     # 24x7 Emergency and ICU bed availability
  cost_headroom: 15         # Indicative tariff fits remaining sum insured

thresholds:
  high_match: 90
  medium_match: 70
  low_match: 50

deductions:
  out_of_network_penalty: 25
  room_mismatch_penalty: 20
  unknown_network_penalty: 10
